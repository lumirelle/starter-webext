image:
  file: .gitpod.Dockerfile

tasks:
  - init: mise install && mise run build
    name: dev
    command: |
      gp sync-done ready
      mise run dev
  - name: mise run start
    command: |
      gp sync-await ready
      gp ports await 6080
      gp preview $(gp url 6080)
      sleep 5
      mise run start
    openMode: split-right

ports:
  - port: 5900
    onOpen: ignore
  - port: 6080
    onOpen: ignore
